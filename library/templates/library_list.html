<style>
table, th, td {
  border: 1px solid black;
  border-collapse: collapse;
}
</style>

<h2>Add Book</h2>

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
</form>

<h2>Book List</h2>

<table>
  <tr>
    <th>Title</th>
    <th>Author</th>
    <th>Price</th>
    <th>Quantity</th>
  </tr>

{% for Lib in library %}

  <tr>
    <td>{{ Lib.title }}</td>
    <td>{{ Lib.author }}</td>
    <td>{{ Lib.price }}</td>
    <td>{{ Lib.quantity }}</td>
  </tr>

{% endfor %}

</table>
